AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: NLP Processor - Extrai eventos estruturados de raw_crawls usando Groq/Llama

Parameters:
  MongoDbUri:
    Type: String
    Description: MongoDB Atlas connection string
    NoEcho: true
  MongoDbName:
    Type: String
    Description: Nome do banco de dados MongoDB
    Default: role_sc
  GroqApiKey:
    Type: String
    Description: API Key do Groq
    NoEcho: true

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 300
    MemorySize: 256

Resources:
  NlpProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: PROCESSAR_CRAWLS_NLP
      CodeUri: ./
      Handler: src/handler.handler
      Description: Processa raw_crawls com IA e gera eventos estruturados
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
          MONGODB_DB_NAME: !Ref MongoDbName
          GROQ_API_KEY: !Ref GroqApiKey
      Events:
        HourlySchedule:
          Type: ScheduleV2
          Properties:
            Name: RODAR_PROCESSADOR_NLP_DAS_8_AS_19
            Description: Executa 1x por hora das 8h as 19h (America/Sao_Paulo)
            ScheduleExpression: cron(0 8-19 * * ? *)
            ScheduleExpressionTimezone: America/Sao_Paulo
            Input: '{"batchSize": 50}'
            State: ENABLED
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2022"
        Sourcemap: false
        EntryPoints:
          - src/handler.ts

Outputs:
  NlpProcessorFunction:
    Description: ARN da Lambda NLP Processor
    Value: !GetAtt NlpProcessorFunction.Arn
  NlpProcessorFunctionName:
    Description: Nome da Lambda NLP Processor
    Value: !Ref NlpProcessorFunction
